name: Build worker
description: >-
  generated/*.csv を組み立てて Worker (wasm) をビルドし、公開スキーマとの差分と
  バンドルサイズを検証する。検証用ワークフローとデプロイ用ワークフローで同じ
  手順を使うため composite action に切り出してある。

inputs:
  odpt-access-token:
    description: >-
      ODPT の consumer key。空にすると西武バス・京王バス・東急バスと
      そのコミュニティ路線が HTTP 403 で落ち、都営バスと名古屋市SRTだけが取り込まれる。
      preprocessor は警告して続行するため、欠損に気付けるよう
      fail-on-missing-bus-feeds と併用すること。
    required: false
    default: ""
  fail-on-missing-bus-feeds:
    description: >-
      true にすると、トークンが要るバスフィードを 1 つでも取り込めなかった
      場合にビルドを失敗させる。デプロイ用ワークフローで有効にして、欠損した
      データが staging / production へ出ていくのを止める。
    required: false
    default: "false"
  worker-build-version:
    description: worker-build のバージョン (ビルド結果を再現できるよう固定する)
    required: false
    default: "0.8.5"
  wrangler-version:
    description: wrangler のバージョン (Makefile の WRANGLER_VERSION と揃えること)
    required: false
    default: "4.125.0"

# ローカル action は checkout 済みでないと解決できないため、checkout は
# 呼び出し側のワークフローに置いてある。
runs:
  using: composite
  steps:
    - name: Install wasm target
      shell: bash
      run: rustup target add wasm32-unknown-unknown

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: worker-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

    # N02 の取得先は国の配信サーバーで、取得に失敗すると preprocessor が失敗する。
    # サーバーの一時的な不調で検証やデプロイが止まらないよう、展開した GeoJSON を
    # キャッシュする。中身は版で決まるので、キーは版だけにする
    # (preprocessor/src/track/mod.rs の CACHE_DIR と揃えること)。
    - name: Cache N02 railway data
      uses: actions/cache@v4
      with:
        path: data/N02-25
        key: n02-25

    # 埼玉県の配布ZIPは公式サイトから毎回取得する。署名付き転送先はログに出さない。
    - name: Fetch registered Saitama Open Data GTFS
      shell: python
      run: |
        import hashlib
        import json
        import shutil
        import tempfile
        from pathlib import Path
        from urllib.request import Request, urlopen
        from zipfile import ZipFile

        REGISTRY = Path("data/gtfs-feeds")
        CACHE = Path("data/gtfs-cache")
        PORTAL = "https://opendata.pref.saitama.lg.jp/resource_download/"
        REQUIRED = {"routes.txt", "stops.txt", "trips.txt", "stop_times.txt"}


        def fetch(registration, url):
            CACHE.mkdir(parents=True, exist_ok=True)
            destination = CACHE / registration.stem
            if destination.exists():
                if not all((destination / name).is_file() for name in REQUIRED):
                    raise ValueError(f"Incomplete GTFS cache at {destination}")
                return
            request = Request(url, headers={"User-Agent": "TrainLCD/StationAPI (GTFS data importer)"})
            with tempfile.TemporaryDirectory(dir=CACHE) as staging:
                archive = Path(staging) / "feed.zip"
                with urlopen(request, timeout=60) as response, archive.open("wb") as output:
                    shutil.copyfileobj(response, output)
                extracted = Path(staging) / "extracted"
                extracted.mkdir()
                with ZipFile(archive) as feed:
                    # The source publishes flat GTFS ZIPs. Keep only top-level GTFS text files.
                    members = [
                        member for member in feed.infolist()
                        if Path(member.filename).name == member.filename
                        and member.filename.endswith(".txt")
                    ]
                    names = {m.filename for m in members}
                    if len(names) != len(members) or not REQUIRED <= names:
                        raise ValueError(f"Invalid GTFS archive for {registration.stem}")
                    for member in members:
                        with feed.open(member) as source, (extracted / member.filename).open("xb") as output:
                            shutil.copyfileobj(source, output)
                extracted.rename(destination)
                print(f"{registration.stem} {url} SHA-256 {hashlib.sha256(archive.read_bytes()).hexdigest()}")


        if __name__ == "__main__":
            for registration in sorted(REGISTRY.glob("*.json")):
                url = json.loads(registration.read_text(encoding="utf-8"))["url"]
                if url.startswith(PORTAL) and url.removeprefix(PORTAL).isdigit():
                    fetch(registration, url)

    # data/*.csv をそのまま Worker へ渡すと本番と挙動が変わる。列車種別を
    # 持たない路線には各駅停車の系統を補う必要があり (約2,400行)、バス停と
    # バス路線は GTFS / ODPT から、駅間の線路の長さは国土数値情報 (N02) から
    # 起こす必要があるため。N02 はトークン不要で、取得に失敗すると preprocessor
    # 自体が失敗する。
    - name: Build generated data
      shell: bash
      env:
        ODPT_ACCESS_TOKEN: ${{ inputs.odpt-access-token }}
      run: cargo run --profile tool -p stationapi-preprocessor 2>&1 | tee /tmp/preprocessor.log

    # preprocessor はフィードを取り込めなくても警告だけ出して続行する。
    # 欠損したデータのままビルドが緑で通り、そのままデプロイされうるので、
    # デプロイ経路では取りこぼしを失敗として扱う。
    - name: Verify bus feeds
      shell: bash
      env:
        STRICT: ${{ inputs.fail-on-missing-bus-feeds }}
      run: |
        # フィード全体のスキップと、必須ファイル・ディレクトリの欠損を検出する。
        # 任意の translations.txt は、欠損時にこの警告を出さない。
        if grep -qE "このフィードを飛ばす|が無いので読み飛ばす" /tmp/preprocessor.log; then
          grep -E "このフィードを飛ばす|が無いので読み飛ばす" /tmp/preprocessor.log
          if [ "$STRICT" = "true" ]; then
            echo "::error::バスデータに欠損がある。取得エラーと必須ファイルの欠損警告を確認すること"
            exit 1
          fi
          echo "::warning::バスデータに欠損がある (検証ビルドのため続行する)"
        else
          echo "すべてのバスフィードを取り込んだ"
        fi

    - name: Verify generated data
      shell: bash
      run: |
        for t in companies lines stations types station_station_types aliases line_aliases connections; do
          test -s "generated/$t.csv" || { echo "::error::$t.csv が空"; exit 1; }
          echo "$t: $(python3 -c "import csv,sys;print(sum(1 for _ in csv.reader(open(sys.argv[1]))) - 1)" "generated/$t.csv") rows"
        done
        bus=$(awk -F, 'NR>1 && $NF == 1' generated/stations.csv | wc -l)
        echo "bus stops: $bus"

    - name: Install worker-build
      shell: bash
      run: cargo install worker-build --locked --version "${{ inputs.worker-build-version }}"

    - name: Build worker
      shell: bash
      run: worker-build --release

    # 公開スキーマから外れるとクライアントが壊れる。SDL を取り出して
    # schema/public.graphql と突き合わせる。
    - name: Verify GraphQL schema
      shell: bash
      run: |
        npx --yes "wrangler@${{ inputs.wrangler-version }}" dev --port 8787 &
        for _ in $(seq 1 120); do
          curl -sf http://127.0.0.1:8787/__ping >/dev/null 2>&1 && break
          sleep 2
        done
        curl -sf http://127.0.0.1:8787/__schema -o /tmp/generated.graphql
        kill %1 || true
        python3 scripts/compare_schema.py schema/public.graphql /tmp/generated.graphql

    - name: Report bundle size
      shell: bash
      run: |
        raw=$(stat -c%s build/index_bg.wasm)
        gz=$(gzip -9 -c build/index_bg.wasm | wc -c)
        echo "wasm raw: $((raw / 1024)) KiB"
        echo "wasm gzip: $((gz / 1024)) KiB (Workers upper limit is 10 MiB)"
        # 上限を超える前に気付けるよう、8 MiB を閾値にする
        if [ "$gz" -gt $((8 * 1024 * 1024)) ]; then
          echo "::error::gzip size exceeds 8 MiB"
          exit 1
        fi
