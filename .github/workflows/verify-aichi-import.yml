name: Verify Aichi import
on:
  pull_request:
    paths: [.github/workflows/verify-aichi-import.yml]
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage candidate registrations
