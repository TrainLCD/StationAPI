      - uses: ./.github/actions/build-worker
      - name: Query embedded data
        run: |
          npx --yes wrangler@4.125.0 dev --port 8791 >/tmp/wrk.log 2>&1 &
          trap 'kill $! || true' EXIT
          for attempt in {1..90}; do curl -fsS http://127.0.0.1:8791/__ping && break; sleep 2; done
          python3 - <<'PY'
          import csv,json,urllib.request,pathlib
          def query(s):
              req=urllib.request.Request("http://127.0.0.1:8791/",json.dumps({"query":"{ "+s+" }"}).encode(),{"Content-Type":"application/json"})
              r=json.load(urllib.request.urlopen(req))
              assert "errors" not in r,r
              return next(iter(r["data"].values()))
          lines=list(csv.DictReader(open("generated/lines.csv")))
          log=pathlib.Path("/tmp/preprocessor.log").read_text()
          for path in sorted(pathlib.Path("data/gtfs-feeds").glob("*_aichi_*.json")):
              f=json.loads(path.read_text())
              id=int(path.stem.split("_")[4])
              try:
                  assert f["name"]+" の GTFS を取り込んだ" in log,"feed skipped"
                  own=[r for r in lines if r["company_cd"]==str(f["company_cd"])]
                  assert own,"no lines"
                  for r in own:
                      lid=int(r["line_cd"])
                      matches=query('linesByName(name:'+json.dumps(r["line_name"],ensure_ascii=False)+',limit:100){id}')
                      if not any(v["id"]==lid for v in matches): continue
                      stops=query(f'lineStations(lineId:{lid},transportType:Bus){{id name prefectureId}}')
                      for stop in stops[:4]:
                          if stop["prefectureId"]!=23: continue
                          hits=query('stationsByName(name:'+json.dumps(stop["name"],ensure_ascii=False)+',transportType:Bus,limit:100){id name}')
                          patterns=query('stationTrainTypes(stationId:'+str(stop["id"])+'){name groupId}')
                          if hits and patterns: break
                      else: continue
                      print("RESULT",json.dumps([id,len(own),r["line_name"],stop["name"],len(patterns)],ensure_ascii=False),flush=True)
                      break
                  else: raise ValueError("no matching search result")
              except Exception as e: print("RESULT",json.dumps([id,str(e)],ensure_ascii=False),flush=True)
          PY
