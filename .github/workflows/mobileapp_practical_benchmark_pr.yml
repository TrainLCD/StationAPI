name: MobileApp practical GraphQL benchmark PR

on:
  pull_request:
    branches: [master]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch MobileApp query definitions
        run: git clone --depth 1 --branch dev https://github.com/TrainLCD/MobileApp.git /tmp/MobileApp
      - name: Run MobileApp-equivalent practical benchmark
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          p = Path('.github/workflows/mobileapp_practical_benchmark.yml')
          text = p.read_text()
          marker = '        shell: python\n        run: |\n'
          code = textwrap.dedent(text.split(marker, 1)[1])

          helper = r'''
          def dedupe_fragments(doc):
              seen = set()
              out = []
              pos = 0
              pat = re.compile(r'fragment\s+(\w+)\s+on\s+\w+\s*\{')
              while True:
                  m = pat.search(doc, pos)
                  if not m:
                      out.append(doc[pos:])
                      break
                  out.append(doc[pos:m.start()])
                  name = m.group(1)
                  brace = doc.find('{', m.start())
                  depth = 0
                  end = brace
                  for i in range(brace, len(doc)):
                      if doc[i] == '{':
                          depth += 1
                      elif doc[i] == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if name not in seen:
                      out.append(doc[m.start():end])
                      seen.add(name)
                  pos = end
              return ''.join(out)
          '''
          helper = textwrap.dedent(helper)
          code = code.replace('def resolve(name, stack=()):', helper + '\ndef resolve(name, stack=()):', 1)
          needle = "    return re.sub(r'\\$\\{(\\w+)\\}', lambda m: resolve(m.group(1), stack + (name,)), body)"
          replacement = "    expanded = re.sub(r'\\$\\{(\\w+)\\}', lambda m: resolve(m.group(1), stack + (name,)), body)\n    return dedupe_fragments(expanded)"
          if needle not in code:
              raise RuntimeError('Could not patch resolver for graphql-tag fragment de-duplication')
          code = code.replace(needle, replacement, 1)

          # Fair route scenario: force the same physical line and OD in both environments.
          replacements = [
              (
                  "    shinjuku = next((s for s in found if s.get('name') == '新宿'), found[0])",
                  "    shinjuku = next((s for s in found if s.get('name') == '新宿' and (s.get('line') or {}).get('id') == 11312), next((s for s in found if s.get('name') == '新宿'), found[0]))",
              ),
              (
                  "    via_line_id = (shinjuku.get('line') or {}).get('id')",
                  "    via_line_id = 11312",
              ),
              (
                  "    line_group_id = next((t.get('groupId') for t in train_types if t.get('groupId') is not None), None)",
                  "    matched_tt = next((t for t in train_types if (t.get('line') or {}).get('id') == via_line_id or any((l or {}).get('id') == via_line_id for l in (t.get('lines') or []))), None)\n    line_group_id = (matched_tt or {}).get('groupId') if matched_tt else next((t.get('groupId') for t in train_types if t.get('groupId') is not None), None)",
              ),
              (
                  "    ctx[env] = {",
                  "    current_line_ids = sorted(current_line_ids)\n\n    ctx[env] = {",
              ),
          ]
          for old, new in replacements:
              if old not in code:
                  raise RuntimeError(f'Fairness patch target not found: {old}')
              code = code.replace(old, new, 1)

          exec(compile(code, str(p), 'exec'))
