name: Check Toyotetsu GTFS
on:
  push:
    branches: [feature/gtfs-aichi-0443-toyotetsu]
    paths: [.github/workflows/check-toyotetsu.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --location --retry 2 --max-time 90 https://loc.bus-vision.jp/gtfs/toyotetsu/gtfsFeed -o feed.zip
      - shell: python
        run: |
          import csv
          import hashlib
          import io
          import pathlib
          import zipfile
          path = pathlib.Path("feed.zip")
          print("sha256", hashlib.sha256(path.read_bytes()).hexdigest())
          with zipfile.ZipFile(path) as archive:
              def rows(name):
                  with archive.open(name + ".txt") as raw:
                      yield from csv.DictReader(io.TextIOWrapper(raw, encoding="utf-8-sig"))
              routes = {r["route_id"] for r in rows("routes")}
              stops = {r["stop_id"] for r in rows("stops")}
              timed = {r["trip_id"] for r in rows("stop_times") if r["stop_id"] in stops}
              served = {r["route_id"] for r in rows("trips") if r["trip_id"] in timed}
              print("routes", len(routes), "served", len(served), "missing", sorted(routes - served))
              assert routes and routes <= served
