ommunitybus\",\"license\":\"CC BY 4.0\"},{\"id\":484,\"name\":\"豊川市コミュニティバス\",\"url\":\"https://opendata-east-mikawa.jp/node/1784/download\",\"source\":\"https://opendata-east-mikawa.jp/node/1783\",\"license\":\"CC BY 4.0\"},{\"id\":485,\"name\":\"おでかけ北設(設楽町・東栄町・豊根村)\",\"url\":\"https://api.gtfs-data.jp/v2/organizations/kitashitara/feeds/odekakehokusetsu/files/feed.zip\",\"source\":\"https://gtfs-data.jp/search?target_feed=kitashitara*odekakehokusetsu\",\"license\":\"CC BY 4.0\"}]")
          def check(f):
              try:
                  with urllib.request.urlopen(f["url"], timeout=30) as res:
                      raw=res.read()
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      def rows(name):
                          return list(csv.DictReader(io.TextIOWrapper(z.open(name+".txt"),encoding="utf-8-sig")))
                      routes={r["route_id"] for r in rows("routes")}
                      trips=rows("trips")
                      stops=rows("stops")
                      times={r["trip_id"] for r in rows("stop_times")}
                      served={r["route_id"] for r in trips if r["trip_id"] in times}
                      alltr={r["route_id"] for r in trips}
                      print("DATA",json.dumps(dict(id=f["id"],r=len(routes),s=len(stops),served=len(served),empty=len(routes-alltr),broken=sorted((routes&alltr)-served),agency=rows("agency"),sha=hashlib.sha256(raw).hexdigest()),ensure_ascii=False),flush=True)
              except Exception as e:
                  print("DATA",json.dumps(dict(id=f["id"],error=str(e)),ensure_ascii=False),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              list(ex.map(check,feeds))
