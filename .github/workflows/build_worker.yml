# データと Worker のビルドが通ることと、公開スキーマから外れていないことを
# 検証するだけのワークフロー。デプロイはしない。
#
# デプロイは環境ごとに別ファイルへ分けてある:
#   dev    -> deploy_staging.yml    (stationapi-stg)
#   master -> deploy_production.yml (stationapi)
# デプロイ先をトリガとファイルで固定することで、他のブランチが誤って
# どこかの環境へ向くことがないようにしている。
on:
  pull_request:
    # GitHub Actions は YAML のアンカー / エイリアスを解釈しないため、
    # このリストは push 側と二重に書く必要がある。片方だけ直さないこと。
    paths:
      - "src/**"
      - "schema/**"
      - "scripts/compare_schema.py"
      - "stationapi/**"
      - "preprocessor/**"
      - "data/**"
      - "build.rs"
      - "wrangler.jsonc"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/actions/build-worker/action.yml"
      - ".github/workflows/build_worker.yml"
  push:
    # dev / master は deploy_staging.yml / deploy_production.yml が同じ
    # composite action で検証してからデプロイするため、ここでは走らせない。
    branches-ignore:
      - dev
      - master
    paths:
      - "src/**"
      - "schema/**"
      - "scripts/compare_schema.py"
      - "stationapi/**"
      - "preprocessor/**"
      - "data/**"
      - "build.rs"
      - "wrangler.jsonc"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/actions/build-worker/action.yml"
      - ".github/workflows/build_worker.yml"
  workflow_dispatch:

name: Build Cloudflare Worker

jobs:
  build:
    name: Build data and worker
    runs-on: ubuntu-latest

    # ここでは environment を宣言しない。environment は if: と違って
    # ジョブが走れば必ず適用されるため、宣言すると全ブランチ・全 PR が
    # その環境へのデプロイとして履歴に載り、環境 Secret (デプロイ用の
    # CLOUDFLARE_API_TOKEN を含む) が任意のブランチのビルドから触れる。
    #
    # その代わり ODPT_ACCESS_TOKEN は空になり、トークンが要るバスフィードは
    # 取り込まれない。検証としては成立する (スキーマもバンドルサイズもバスの
    # 有無に依らない) ため、ここでは警告に留める。デプロイ経路では
    # fail-on-missing-bus-feeds を有効にして取りこぼしを失敗にしている。
    steps:
      # checkout は既定で GITHUB_TOKEN を .git/config に残す。後続の
      # cargo install / npx は取得したパッケージのコードを実行するため
      # 読み取られうる。ここから先で git 認証は使わない。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-worker

      - uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: |
            build/
            generated/
          retention-days: 7
