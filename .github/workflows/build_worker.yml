# データと Worker のビルドが通ることと、公開スキーマから外れていないことを
# 検証するだけのワークフロー。デプロイはしない。
#
# デプロイは環境ごとに別ファイルへ分けてある:
#   dev    -> deploy_staging.yml    (stationapi-stg)
#   master -> deploy_production.yml (stationapi)
# デプロイ先をトリガとファイルで固定することで、他のブランチが誤って
# どこかの環境へ向くことがないようにしている。
on:
  pull_request:
    # GitHub Actions は YAML のアンカー / エイリアスを解釈しないため、
    # このリストは push 側と二重に書く必要がある。片方だけ直さないこと。
    paths:
      - "src/**"
      - "schema/**"
      - "scripts/compare_schema.py"
      - "stationapi/**"
      - "preprocessor/**"
      - "data/**"
      - "build.rs"
      - "wrangler.jsonc"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/actions/build-worker/action.yml"
      - ".github/workflows/build_worker.yml"
      - "travel_times/**"
  push:
    # dev / master は deploy_staging.yml / deploy_production.yml が同じ
    # composite action で検証してからデプロイするため、ここでは走らせない。
    branches-ignore:
      - dev
      - master
    paths:
      - "src/**"
      - "schema/**"
      - "scripts/compare_schema.py"
      - "stationapi/**"
      - "preprocessor/**"
      - "data/**"
      - "build.rs"
      - "wrangler.jsonc"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/actions/build-worker/action.yml"
      - ".github/workflows/build_worker.yml"
      - "travel_times/**"
  workflow_dispatch:

name: Build Cloudflare Worker

jobs:
  build:
    name: Build data and worker
    runs-on: ubuntu-latest

    # ここでは environment を宣言しない。environment は if: と違って
    # ジョブが走れば必ず適用されるため、宣言すると全ブランチ・全 PR が
    # その環境へのデプロイとして履歴に載り、環境 Secret (デプロイ用の
    # CLOUDFLARE_API_TOKEN を含む) が任意のブランチのビルドから触れる。
    #
    # その代わり ODPT_ACCESS_TOKEN は空になり、トークンが要るバスフィードは
    # 取り込まれない。検証としては成立する (スキーマもバンドルサイズもバスの
    # 有無に依らない) ため、ここでは警告に留める。デプロイ経路では
    # fail-on-missing-bus-feeds を有効にして取りこぼしを失敗にしている。
    steps:
      # checkout は既定で GITHUB_TOKEN を .git/config に残す。後続の
      # cargo install / npx は取得したパッケージのコードを実行するため
      # 読み取られうる。ここから先で git 認証は使わない。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-worker

      # 到着時間推定の所要時間の見張り (src/travel_times.rs)。記録
      # (travel_times/baseline.csv) は本番と同じ生成データで作るので、上の
      # action が generated/ を作ったこのジョブで比べる。バスのフィードが
      # 欠けても鉄道の推定は変わらない。
      - name: Check travel times against the benchmark
        run: cargo test -p stationapi-worker travel_times

      # 公開GTFSから生成したデータで、のりば番号と停車順をGraphQL経由で検証する。
      - name: Check C-758 stop order and platform codes
        run: cargo test -p stationapi-worker c758_graphql_keeps_the_platform_codes_in_stop_order -- --ignored

      - name: Verify Saitama Kita feed and GraphQL results
        run: |
          npx --yes wrangler@4.125.0 dev --port 8791 >/tmp/kita-worker.log 2>&1 &
          trap 'kill $! || true' EXIT
          for attempt in {1..90}; do curl -fsS http://127.0.0.1:8791/__ping && break; sleep 2; done
          python3 - <<'PY'
          import csv, json, urllib.request
          def query(q):
              data = json.dumps({"query": "{ " + q + " }"}).encode()
              request = urllib.request.Request("http://127.0.0.1:8791/", data, {"Content-Type": "application/json"})
              result = json.load(urllib.request.urlopen(request))
              assert not result.get("errors"), result
              return next(iter(result["data"].values()))
          with open("generated/lines.csv") as f:
              lines = [r for r in csv.DictReader(f) if r["company_cd"] == "327"]
          assert lines, "feed missing"
          for line in lines:
              lid = int(line["line_cd"])
              name = line["line_name"]
              assert any(r["id"] == lid for r in query(f'linesByName(name:{json.dumps(name)}) {{ id }}'))
              stops = query(f'lineStations(lineId:{lid}) {{ id name prefectureId }}')
              assert stops and all(s["prefectureId"] == 11 for s in stops), stops
              stop = stops[0]
              assert any(s["id"] == stop["id"] for s in query(f'stationsByName(name:{json.dumps(stop["name"])}, limit:100) {{ id }}'))
              patterns = query(f'stationTrainTypes(stationId:{stop["id"]}) {{ groupId name }}')
              assert patterns, stop
              print(name, len(stops), stop["name"], patterns)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: |
            build/
            generated/
          retention-days: 7
