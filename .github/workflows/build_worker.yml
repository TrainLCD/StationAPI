on:
  pull_request:
    paths:
      - "src/**"
      - "schema/**"
      - "scripts/compare_schema.py"
      - ".github/workflows/build_worker.yml"
      - "stationapi/**"
      - "preprocessor/**"
      - "data/**"
      - "build.rs"
      - "wrangler.jsonc"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    paths:
      - "src/**"
      - "schema/**"
      - "scripts/compare_schema.py"
      - ".github/workflows/build_worker.yml"
      - "stationapi/**"
      - "preprocessor/**"
      - "data/**"
      - "build.rs"
      - "wrangler.jsonc"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

name: Build Cloudflare Worker

env:
  # ビルド結果を再現できるよう、ツールのバージョンを固定する
  WORKER_BUILD_VERSION: "0.8.5"
  WRANGLER_VERSION: "4.125.0"

jobs:
  build:
    name: Build data and worker
    runs-on: ubuntu-latest

    env:
      # トークンが無ければトークン不要のフィード (都営バス) だけが取り込まれ、
      # 他は警告を出してスキップされる。バスごと外したい場合は
      # DISABLE_BUS_FEATURE=true を設定する。
      ODPT_ACCESS_TOKEN: ${{ secrets.ODPT_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: worker-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # data/*.csv をそのまま Worker へ渡すと本番と挙動が変わる。列車種別を
      # 持たない路線には各駅停車の系統を補う必要があり (約2,400行)、バス停と
      # バス路線は GTFS / ODPT から起こす必要があるため。
      - name: Build generated data
        run: cargo run --profile tool -p stationapi-preprocessor

      - name: Verify generated data
        run: |
          for t in companies lines stations types station_station_types aliases line_aliases; do
            test -s "generated/$t.csv" || { echo "::error::$t.csv が空"; exit 1; }
            echo "$t: $(python3 -c "import csv,sys;print(sum(1 for _ in csv.reader(open(sys.argv[1]))) - 1)" "generated/$t.csv") rows"
          done
          # バスが取り込めたかを可視化する (取り込めなくてもビルドは続行する)
          bus=$(awk -F, 'NR>1 && $NF == 1' generated/stations.csv | wc -l)
          echo "bus stops: $bus"

      - name: Install worker-build
        run: cargo install worker-build --locked --version "$WORKER_BUILD_VERSION"

      - name: Build worker
        run: worker-build --release

      # 公開スキーマから外れるとクライアントが壊れる。SDL を取り出して
      # schema/public.graphql と突き合わせる。
      - name: Verify GraphQL schema
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" dev --port 8787 &
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:8787/__ping >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/__schema -o /tmp/generated.graphql
          kill %1 || true
          python3 scripts/compare_schema.py schema/public.graphql /tmp/generated.graphql

      - name: Report bundle size
        run: |
          raw=$(stat -c%s build/index_bg.wasm)
          gz=$(gzip -9 -c build/index_bg.wasm | wc -c)
          echo "wasm raw: $((raw / 1024)) KiB"
          echo "wasm gzip: $((gz / 1024)) KiB (Workers upper limit is 10 MiB)"
          # 上限を超える前に気付けるよう、8 MiB を閾値にする
          if [ "$gz" -gt $((8 * 1024 * 1024)) ]; then
            echo "::error::gzip size exceeds 8 MiB"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: |
            build/
            generated/
          retention-days: 7

  deploy:
    name: Deploy worker
    needs: build
    runs-on: ubuntu-latest

    # dev -> staging (stationapi-stg)、master -> production (stationapi)。
    # それ以外のブランチと pull_request はビルドの検証までで止める。
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')

    # production 環境には承認レビューを設定してあるため、本番へ出すときだけ
    # 人の承認を挟んで止まる。staging は無条件に進む。
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}

    # 同じ環境へ同時に流れると、先に始まった古い版が後から上書きしうる。
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # staging は wrangler.jsonc の top-level 設定なので、環境名は空にする。
      # wrangler 4 は環境が複数あると --env の省略を警告するため、空でも明示する。
      TARGET_ENV: ${{ github.ref == 'refs/heads/master' && 'production' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      # build ジョブと同じキーで読むだけにする。書き戻すのは build ジョブの役目。
      - name: Restore cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: worker-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # build ジョブが検証したのと同じ generated/ を使う。ここで preprocessor を
      # 動かし直すと GTFS の取得結果が変わりうるため、スキーマを検証していない
      # データが本番へ出てしまう。
      - uses: actions/download-artifact@v4
        with:
          name: worker-build

      - name: Install worker-build
        run: cargo install worker-build --locked --version "$WORKER_BUILD_VERSION"

      # wrangler deploy は wrangler.jsonc の build.command (worker-build --release)
      # を必ず実行し、これを飛ばすフラグは無い。generated/ を持ち込んであるので
      # build ジョブと同じ入力から同じ wasm が組み上がる。
      - name: Deploy
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --env="$TARGET_ENV"
