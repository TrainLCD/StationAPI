[package]
name = "stationapi"
version = "0.1.0"
edition = "2021"

# ドメインとユースケースだけを持つライブラリ。配信は Cloudflare Workers 上の
# GraphQL (ルートの stationapi-worker crate)、データ生成は preprocessor crate が担う。
# wasm32-unknown-unknown でそのままビルドできる必要があるため、
# I/O を伴う依存は入れない。

[dependencies]
async-trait = "0.1.68"
serde = { version = "1.0.189", features = ["derive"] }
anyhow = "1.0.71"
thiserror = "1.0.40"
# try_join! と #[tokio::test] のみ使用。ランタイムは持ち込まない。
tokio = { version = "1.28.0", default-features = false, features = ["macros"] }

[dev-dependencies]
# エンティティのシリアライズ往復テストで使う。
serde_json = "1.0.107"
# #[tokio::test] にはランタイムが要る。本体には持ち込まない (wasm32 で動かないため)。
tokio = { version = "1.28.0", features = ["macros", "rt"] }
