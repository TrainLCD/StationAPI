[package]
name = "stationapi"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# 依存は2群に分かれる。
# - 共通: domain / use_case / proto が使う。wasm32 でもビルドできる必要がある。
# - server 専用: infrastructure / presentation / main が使う。ネイティブのみ。
[[bin]]
name = "stationapi"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
async-trait = "0.1.68"
prost = "0.13.3"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
anyhow = "1.0.71"
thiserror = "1.0.40"
# try_join! と #[tokio::test] のみ使用。ランタイムは server feature 側で有効化する。
tokio = { version = "1.28.0", default-features = false, features = ["macros"] }

dotenv = { version = "0.15.0", optional = true }
sqlx = { version = "0.8.3", optional = true, features = [
    "runtime-tokio-native-tls",
    "postgres",
    "macros",
    "derive",
    "chrono",
] }
tonic = { version = "0.12.3", optional = true }
tonic-web = { version = "0.12.3", optional = true }
tonic-health = { version = "0.12.3", optional = true }
tonic-reflection = { version = "0.12.3", optional = true }
tracing = { version = "0.1.37", optional = true }
tracing-subscriber = { version = "0.3.17", optional = true }
csv = { version = "1.3.1", optional = true }
chrono = { version = ">=0.4.20", optional = true }
reqwest = { version = "0.12.12", optional = true, default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
zip = { version = ">=2.3.0", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }
pin-project-lite = { version = "0.2", optional = true }
http = { version = "1", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }

[build-dependencies]
tonic-build = "0.12.3"

[dev-dependencies]
# テスト用の依存関係はここに追加
# 既存の依存関係（tokio, sqlx等）はテストでも使用可能

[features]
default = ["server"]
# ネイティブの gRPC サーバー一式。これを外すと domain / use_case / proto だけが残り、
# wasm32-unknown-unknown でビルドできる。
server = [
    "dep:dotenv",
    "dep:sqlx",
    "dep:tonic",
    "dep:tonic-web",
    "dep:tonic-health",
    "dep:tonic-reflection",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:csv",
    "dep:chrono",
    "dep:reqwest",
    "dep:zip",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:pin-project-lite",
    "dep:http",
    "dep:tower",
    "tokio/full",
]
# 統合テスト用 feature（データベース接続が必要なテスト）
integration-tests = []
