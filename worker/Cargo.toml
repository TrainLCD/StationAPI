[package]
name = "stationapi-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# stationapi は server feature を切って domain / use_case / proto だけを取り込む
stationapi = { path = "../stationapi", default-features = false }
worker = "0.8"
async-trait = "0.1"
prost = "0.13.3"
csv = "1.3"
console_error_panic_hook = "0.1"

[build-dependencies]
csv = "1.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
